<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Personal Profile Card</title>

    <style>

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #eef2f7;
            font-family: Arial, sans-serif;
        }

        .profile-card {
            width: 350px;
            background-color: #ffffff;
            padding: 30px;                
            border: 2px solid #ccc;      
            border-radius: 15px;          
            margin: 20px;                 
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

     
        .profile-card h1 {
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
            color: #222;
            text-decoration: underline;   
        }

        .role {
            font-size: 18px;
            font-weight: 600;
            color: #007bff;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .description {
            font-size: 15px;
            font-family:R;
            line-height: 1.7;
            color: #555;
            margin-bottom: 25px;
        }

       
        .contact-btn {
            padding: 12px 25px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .contact-btn:hover {
            background-color: #0056b3;
            letter-spacing: 1px;
        }

    </style>
</head>

<body>

    <div class="profile-card">
        <h1>Aravind Anugula</h1>
        <div class="role">Full Stack Developer</div>
        <p class="description">
            Passionate IT graduate who loves coding, learning new technologies,
            and building responsive web applications.
        </p>
        <button class="contact-btn">Contact Me</button>
    </div>

</body>
</html>
