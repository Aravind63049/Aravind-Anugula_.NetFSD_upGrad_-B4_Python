<!DOCTYPE html>
<html>
<head>
    <title>Number Analysis Tool</title>
</head>
<body>

<script>

    let input = prompt("Enter a number:");
    let num = Number(input);

    if (isNaN(num)) {
        console.log("Error: Please enter a valid number!");
    } 
    else {

  
         console.log((num >= 0) ? "Positive Number" : "Negative Number");
        

     
        if (num % 2 === 0) {
            console.log("Number is Even");
        } else {
            console.log("Number is Odd");
        }

        if (num > 0) {
            console.log("Numbers from 1 to " + num + ":");
            for (let i = 1; i <= num; i++) {
                console.log(i);
            }
        } else {
            console.log("please enter postive number");
        }

    }

</script>

</body>
</html>
