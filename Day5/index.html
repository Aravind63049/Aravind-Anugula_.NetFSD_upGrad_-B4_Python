<body>
    <script>
        class student {
            constructor(name,age,grade){
                this.name = name;
                this.age = age;
                this.grade = grade; 
            }
        }
        let student1 = new student("Aravind",20,"A");
        console.log(student1);
    </script>
    <script>
        const student2 = new student("Aravindh",24,"B");
        console.log(student2);
    </script>
