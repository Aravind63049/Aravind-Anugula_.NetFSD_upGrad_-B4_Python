<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Responsive Dashboard</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background-color: #f4f6f9;
}


.dashboard {
    display: flex;
    min-height: 100vh;
}

.sidebar {
    background-color: #222;
    color: white;
    padding: 20px;
    width: 220px;
}

.sidebar h2 {
    margin-bottom: 20px;
    letter-spacing: 1px;
}

.sidebar ul {
    list-style: none;
}

.sidebar ul li {
    margin-bottom: 15px;
}

.sidebar ul li a {
    text-decoration: none;
    color: white;
    font-size: 14px;
}

.sidebar ul li a:hover {
    color: #00bcd4;
}


.main-content {
    flex: 1;
    padding: 30px;
}

.cards {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}


.card {
    background-color: white;
    flex: 1 1 250px;
    padding: 20px;
    border: 1px solid #ddd;
    border-radius: 8px;
    margin-bottom: 20px;
    transition: 0.3s;
}

.card:hover {
    box-shadow: 0px 5px 15px rgba(0,0,0,0.1);
    transform: translateY(-5px);
}

.card h3 {
    margin-bottom: 10px;
    font-size: 18px;
}

.card p {
    font-size: 14px;
    color: #555;
}

@media (max-width: 768px) {

    .dashboard {
        flex-direction: column;
    }

    .sidebar {
        width: 100%;
        text-align: center;
    }

    .sidebar ul {
        display: flex;
        justify-content: center;
        gap: 20px;
    }

    .sidebar ul li {
        margin-bottom: 0;
    }

    .cards {
        flex-direction: column;
    }
}

@media (max-width: 480px) {

    .main-content {
        padding: 20px;
    }

    .card {
        flex: 1 1 100%;
    }
}

</style>
</head>

<body>

<div class="dashboard">

   
    <nav class="sidebar">
        <h2>Admin Panel</h2>
        <ul>
            <li><a href="#">Dashboard</a></li>
            <li><a href="#">Users</a></li>
            <li><a href="#">Reports</a></li>
            <li><a href="#">Settings</a></li>
        </ul>
    </nav>

    
    <main class="main-content">
        <div class="cards">

            <div class="card">
                <h3>Total Users</h3>
                <p>1,250 registered users</p>
            </div>

            <div class="card">
                <h3>Revenue</h3>
                <p>$12,400 this month</p>
            </div>

            <div class="card">
                <h3>New Orders</h3>
                <p>320 new orders received</p>
            </div>

            <div class="card">
                <h3>Performance</h3>
                <p>Server uptime 99.9%</p>
            </div>

        </div>
    </main>

</div>

</body>
</html>
